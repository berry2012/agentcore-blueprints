# Gitleaks secret scan.
#
# Scans the commits a pull request or push introduces (full history on manual
# runs) using the repo's .gitleaks.toml. Runs on every PR and push to main,
# regardless of which folders changed.
#
# Gitleaks is installed from its official release tarball with a pinned
# sha256 instead of gitleaks/gitleaks-action. Dependabot does not bump the
# version below; update GITLEAKS_VERSION and GITLEAKS_SHA256 by hand from the
# release's checksums.txt.
name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled. Push and dispatch runs get a unique group
# (run_id): each push scans only its own before..sha range, and GitHub would
# otherwise replace a pending run in a shared group, leaving commits unscanned.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Select commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          log_opts=""
          case "$EVENT" in
            pull_request)
              log_opts="${PR_BASE}..${PR_HEAD}"
              ;;
            push)
              # New branch (all-zeros before) or force-push (before no longer
              # exists): fall back to scanning full history.
              if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                log_opts="${BEFORE}..${SHA}"
              fi
              ;;
          esac
          echo "Gitleaks log range: ${log_opts:-<full history>}"
          echo "log_opts=${log_opts}" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          args=(git --no-banner --redact --exit-code 1 -c .gitleaks.toml)
          if [[ -n "$LOG_OPTS" ]]; then
            args+=("--log-opts=${LOG_OPTS}")
          fi
          gitleaks "${args[@]}" .
