# CodeQL static analysis for the Python in the blueprints (agents, test
# clients, self-tests). Runs when Python changes, weekly, and on demand.
name: CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; push and scheduled runs are not.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload CodeQL results to code scanning
      actions: read # CodeQL reads workflow run metadata
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:python
